[project]
name = "quotation-agent"
version = "0.1.0"
description = "AI quotation agent for a CNC contract manufacturer (Axrail take-home)"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "pypdf>=5.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
